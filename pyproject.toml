[project]
name = "demand"
version = "0.1.0"
description = "Spike Intelligence - demand-intelligence system (starter scaffold)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "statsmodels>=0.14",
]

[project.scripts]
demand = "demand.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demand"]
